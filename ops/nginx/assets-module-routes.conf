# The Assets module shares /assets with Vite's static bundle directory.
# Send only application routes to the SPA; keep missing static files as 404.
# Include inside each application server block, before location /assets/.
location = /assets {
    rewrite ^ /index.html last;
}

location = /assets/ {
    rewrite ^ /index.html last;
}

location ~ "^/assets/(create|[0-9a-fA-F-]{36})(/edit)?/?$" {
    rewrite ^ /index.html last;
}
