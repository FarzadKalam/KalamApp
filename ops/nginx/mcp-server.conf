# Optional Nginx route helpers on api.tazesystem.ir (or self-hosted API domain)
# so clients probing root /.well-known/* or /mcp route seamlessly to mcp-server.
# Note: /functions/v1/mcp-server already works directly via WWW-Authenticate resource_metadata.

location = /mcp {
    proxy_pass https://api.tazesystem.ir/functions/v1/mcp-server;
    proxy_ssl_server_name on;
    proxy_set_header Host api.tazesystem.ir;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-protected-resource {
    proxy_pass https://api.tazesystem.ir/functions/v1/mcp-server/.well-known/oauth-protected-resource;
    proxy_ssl_server_name on;
    proxy_set_header Host api.tazesystem.ir;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-authorization-server {
    proxy_pass https://api.tazesystem.ir/functions/v1/mcp-server/.well-known/oauth-authorization-server;
    proxy_ssl_server_name on;
    proxy_set_header Host api.tazesystem.ir;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
