# Nginx routes on api.tazesystem.ir so clients probing root /.well-known/* or /mcp
# route directly to the mcp-server Edge Function via local Kong (127.0.0.1:8000).
# Note: /functions/v1/mcp-server also serves these routes directly.

location = /mcp {
    proxy_pass http://127.0.0.1:8000/functions/v1/mcp-server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/\.well-known/(oauth-protected-resource|oauth-authorization-server|openid-configuration)(/.*)?$ {
    proxy_pass http://127.0.0.1:8000/functions/v1/mcp-server/.well-known/$1$2$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
