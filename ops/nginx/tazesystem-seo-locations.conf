location = /sitemap.xml {
    proxy_pass https://api.tazesystem.ir/functions/v1/sitemap;
    proxy_ssl_server_name on;
    proxy_set_header Host api.tazesystem.ir;
    add_header Cache-Control "public, max-age=3600" always;
}

location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag $tazesystem_robots always;
    try_files $tazesystem_home_entry /index.html;
}

