[global]
user_agent=KalamApp VoIP Core
endpoint_identifier_order=username,auth_username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
allow_reload=yes
external_media_address=${VOIP_PUBLIC_IP}
external_signaling_address=${VOIP_PUBLIC_IP}

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
allow_reload=yes
external_media_address=${VOIP_PUBLIC_IP}
external_signaling_address=${VOIP_PUBLIC_IP}

[transport-wss]
type=transport
protocol=ws
bind=127.0.0.1:8088
allow_reload=yes
external_media_address=${VOIP_PUBLIC_IP}
external_signaling_address=${VOIP_PUBLIC_IP}
