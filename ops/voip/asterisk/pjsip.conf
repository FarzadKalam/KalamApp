[global]
user_agent=KalamApp VoIP Core
endpoint_identifier_order=username,auth_username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
allow_reload=yes
external_media_address=${VOIP_PUBLIC_IP}
external_signaling_address=${VOIP_PUBLIC_IP}

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
allow_reload=yes
external_media_address=${VOIP_PUBLIC_IP}
external_signaling_address=${VOIP_PUBLIC_IP}

[transport-wss]
type=transport
protocol=ws
; HTTP remains loopback-only in http.conf. A loopback transport bind also
; binds WebRTC RTP to loopback, preventing ICE and audio from reaching clients.
bind=0.0.0.0
allow_reload=yes
external_media_address=${VOIP_PUBLIC_IP}
external_signaling_address=${VOIP_PUBLIC_IP}
