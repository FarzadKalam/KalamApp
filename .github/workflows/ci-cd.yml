name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish this tested release'
        type: boolean
        default: false
      frontend_only:
        description: 'Publish the frontend without applying migrations or deploying Edge Functions'
        type: boolean
        default: false
      woocommerce_connector_only:
        description: 'Deploy just the WooCommerce Edge Function and verify its live response'
        type: boolean
        default: false
      cash_bank_ledger_migration_only:
        description: 'Apply only the approved phase 617 cash and bank ledger migration'
        type: boolean
        default: false
      ai_calendar_release:
        description: 'Publish the AI calendar and provider release with only phases 621 and 622'
        type: boolean
        default: false
      ai_approval_release:
        description: 'Publish the approvals frontend and AI assistant Edge Function without database migrations'
        type: boolean
        default: false
      skip_browser_checks:
        description: 'Skip browser and screenshot checks when explicitly requested by the release owner'
        type: boolean
        default: false

concurrency:
  group: kalamapp-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.deploy && 'deploy' || 'check' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy }}

permissions:
  contents: read
  actions: read

jobs:
  ci:
    if: ${{ !inputs.woocommerce_connector_only }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: ledger_test
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Isolated ledger SQL regression checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/sql/cash_bank_ledger_fixture.sql \
            database_v1_phase568_cash_bank_filtered_totals_and_print.sql \
            database_v1_phase568_cash_bank_filtered_totals_and_print.sql \
            tests/sql/cash_bank_ledger_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Isolated public content calendar regression checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test content_calendar_test
          for file in tests/sql/content_calendar_public_fixture.sql \
            database_v1_phase572_public_content_calendar_status_presentation.sql \
            database_v1_phase572_public_content_calendar_status_presentation.sql \
            tests/sql/content_calendar_public_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d content_calendar_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: SaaS workflow source isolation and invoice deduplication
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test saas_workflow_test
          for file in tests/sql/saas_workflow_sources_fixture.sql \
            database_v1_phase608_saas_workflow_sources_and_related_invoices.sql \
            database_v1_phase608_saas_workflow_sources_and_related_invoices.sql \
            tests/sql/saas_workflow_sources_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d saas_workflow_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: SaaS catalog, sales invoice checkout and support audience
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test saas_sales_test
          for file in tests/sql/saas_workflow_sources_fixture.sql tests/sql/saas_sales_workflows_fixture.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d saas_sales_test -v ON_ERROR_STOP=1 < "$file"
          done
          sed -n '/^create or replace function public.activate_saas_order_items(/,/^end; \$\$;/p' database_v1_phase560_saas_trial_purchase_and_user_seats.sql |
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d saas_sales_test -v ON_ERROR_STOP=1
          for file in \
            database_v1_phase608_saas_workflow_sources_and_related_invoices.sql \
            database_v1_phase609_saas_sales_customer_and_catalog.sql \
            database_v1_phase610_saas_invoice_account_delivery.sql \
            database_v1_phase611_saas_workflow_support_delivery.sql \
            database_v1_phase609_saas_sales_customer_and_catalog.sql \
            database_v1_phase610_saas_invoice_account_delivery.sql \
            database_v1_phase611_saas_workflow_support_delivery.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d saas_sales_test -v ON_ERROR_STOP=1 < "$file"
          done
          docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d saas_sales_test -v ON_ERROR_STOP=1 < tests/sql/saas_sales_workflows_assertions.sql

      - name: Plan entitlements and full demo SQL regression checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test plan_entitlements_test
          sed '/^create role /d' tests/sql/plan_entitlements_fixture.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d plan_entitlements_test -v ON_ERROR_STOP=1
          for file in database_v1_phase584_agent_defaults_and_workflow_triggers.sql \
            database_v1_phase584_agent_defaults_and_workflow_triggers.sql \
            database_v1_phase585_plan_entitlements_and_full_demo.sql \
            database_v1_phase585_plan_entitlements_and_full_demo.sql \
            tests/sql/plan_entitlements_assertions.sql \
            database_v1_phase586_feature_runtime_bindings.sql \
            database_v1_phase586_feature_runtime_bindings.sql \
            tests/sql/feature_runtime_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d plan_entitlements_test -v ON_ERROR_STOP=1 < "$file"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Isolated AI usage and atomic process changes
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test ai_process_usage_test
          for file in tests/sql/ai_process_usage_fixture.sql \
            database_v1_phase591_ai_usage_complete_statistics.sql \
            database_v1_phase591_ai_usage_complete_statistics.sql \
            database_v1_phase592_ai_process_task_atomic_update.sql \
            database_v1_phase592_ai_process_task_atomic_update.sql \
            database_v1_phase593_ai_model_reasoning_defaults.sql \
            database_v1_phase593_ai_model_reasoning_defaults.sql \
            tests/sql/ai_process_usage_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d ai_process_usage_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Cash and bank request context and optimized SQL checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test cash_bank_context_test
          sed '/^create role /d' tests/sql/cash_bank_ledger_fixture.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d cash_bank_context_test -v ON_ERROR_STOP=1
          for file in database_v1_phase568_cash_bank_filtered_totals_and_print.sql \
            tests/sql/cash_bank_context_fixture.sql \
            database_v1_phase582_cash_bank_context_performance.sql \
            database_v1_phase582_cash_bank_context_performance.sql \
            database_v1_phase583_internal_organization_lookup_index.sql \
            database_v1_phase583_internal_organization_lookup_index.sql \
            database_v1_phase617_cash_bank_ledger_cheque_lookup.sql \
            database_v1_phase617_cash_bank_ledger_cheque_lookup.sql \
            tests/sql/cash_bank_cheque_lookup_assertions.sql \
            tests/sql/cash_bank_context_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d cash_bank_context_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Isolated system message access regression checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/sql/system_note_guard_fixture.sql \
            database_v1_phase569_system_note_recipient_guard.sql \
            database_v1_phase569_system_note_recipient_guard.sql \
            database_v1_phase570_system_inbox_recipient_guard.sql \
            database_v1_phase570_system_inbox_recipient_guard.sql \
            tests/sql/system_note_guard_assertions.sql \
            tests/sql/system_note_sender_fixture.sql \
            database_v1_phase571_system_note_sender_is_not_recipient.sql \
            database_v1_phase571_system_note_sender_is_not_recipient.sql \
            tests/sql/system_note_sender_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Isolated conversational agent task queue checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test ai_agent_tasks_test
          for file in tests/sql/ai_agent_tasks_fixture.sql \
            database_v1_phase589_conversational_agent_tasks.sql \
            database_v1_phase589_conversational_agent_tasks.sql \
            database_v1_phase590_agent_tasks_legacy_scheduler_boundary.sql \
            database_v1_phase590_agent_tasks_legacy_scheduler_boundary.sql \
            tests/sql/ai_agent_tasks_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d ai_agent_tasks_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Isolated commission receipts, review cases and stale concurrent posting
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test commission_collection_test
          for file in tests/sql/commission_collection_fixture.sql \
            database_v1_phase586_feature_runtime_bindings.sql \
            database_v1_phase594_commission_posting_snapshot_guard.sql \
            database_v1_phase594_commission_posting_snapshot_guard.sql \
            database_v1_phase595_commission_cheque_review_cases.sql \
            database_v1_phase595_commission_cheque_review_cases.sql \
            tests/sql/commission_collection_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d commission_collection_test -v ON_ERROR_STOP=1 < "$file"
          done
          docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d commission_collection_test -v ON_ERROR_STOP=1 < tests/sql/commission_collection_concurrent_a.sql > /tmp/commission-worker-a.log 2>&1 &
          worker_a=$!
          ready=false
          for attempt in $(seq 1 50); do
            if [ "$(docker exec "$POSTGRES_CONTAINER" psql -U ledger_test -d commission_collection_test -Atc "select count(*) from pg_stat_activity where application_name='commission_concurrency_a' and wait_event='PgSleep'")" = "1" ]; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [ "$ready" != true ]; then cat /tmp/commission-worker-a.log; exit 1; fi
          docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d commission_collection_test -v ON_ERROR_STOP=1 < tests/sql/commission_collection_concurrent_b.sql
          wait "$worker_a"
          cat /tmp/commission-worker-a.log

      - name: AI unread completion, viewer isolation and central read cursors
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test ai_notifications_test
          for file in tests/sql/ai_notifications_fixture.sql \
            database_v1_phase604_ai_notification_read_cursors.sql \
            database_v1_phase604_ai_notification_read_cursors.sql \
            tests/sql/ai_notifications_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d ai_notifications_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Isolated external VoIP account separation
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test voip_external_test
          for file in tests/sql/voip_external_accounts_fixture.sql \
            database_v1_phase596_voip_external_accounts.sql \
            database_v1_phase596_voip_external_accounts.sql \
            tests/sql/voip_external_accounts_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d voip_external_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Isolated SIP bridge authorization and lease checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/sql/voip_provider_bridge_fixture.sql \
            database_v1_phase597_voip_provider_bridge.sql \
            database_v1_phase597_voip_provider_bridge.sql \
            database_v1_phase602_voip_operator_call_presence.sql \
            database_v1_phase602_voip_operator_call_presence.sql \
            database_v1_phase603_customer_voice_sessions.sql \
            database_v1_phase603_customer_voice_sessions.sql \
            tests/sql/customer_voice_session_assertions.sql \
            tests/sql/voip_provider_bridge_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d voip_external_test -v ON_ERROR_STOP=1 < "$file"
          done
          python3 -m unittest discover -s ops/voip/asterisk -p test_bridge_worker.py -v
          python3 -m unittest discover -s ops/voip/asterisk -p test_voice_worker.py -v

      - name: Call contact history isolation and pagination
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/sql/call_contact_history_fixture.sql \
            database_v1_phase598_call_contact_history.sql \
            database_v1_phase598_call_contact_history.sql \
            database_v1_phase599_call_contact_current_org_plan.sql \
            database_v1_phase599_call_contact_current_org_plan.sql \
            database_v1_phase600_call_contact_legacy_reference_types.sql \
            database_v1_phase600_call_contact_legacy_reference_types.sql \
            tests/sql/call_contact_history_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d voip_external_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Asterisk dynamic contact persistence and private grants
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/sql/voip_contact_fields_fixture.sql \
            database_v1_phase601_voip_realtime_contact_fields.sql \
            database_v1_phase601_voip_realtime_contact_fields.sql \
            tests/sql/voip_contact_fields_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d voip_external_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Tenant site and product content RLS integration checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ledger_test tenant_content_test
          for file in tests/database/tenant-content-rls.integration.setup.sql \
            database_v1_phase589_external_sync_history.sql \
            database_v1_phase590_tenant_site_builder.sql \
            database_v1_phase591_product_site_content_drafts.sql \
            database_v1_phase592_woo_import_outcome.sql \
            tests/database/tenant-content-rls.integration.test.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d tenant_content_test -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Install
        run: npm ci

      - name: WooCommerce product content and sales regressions
        run: >-
          npx vitest run test/wooProductSales.test.ts utils/richText.test.ts
          supabase/functions/external-connectors/product-site-content.test.ts
          supabase/functions/external-connectors/product-content-status.test.ts
          supabase/functions/external-connectors/external-sync-history.test.ts
          components/products/ProductWooSyncTable.test.tsx components/moduleShow/FieldGroupsTabs.test.tsx
          --maxWorkers=1 --no-file-parallelism

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx tsc --noEmit

      - name: Central feedback, contact confirmation and popup navigation
        timeout-minutes: 5
        run: >-
          npx vitest run utils/uiNotificationOverlayStore.test.ts utils/notificationOverlayCategories.test.ts
          utils/aiNotifications.test.ts hooks/useAiConversationRead.test.tsx
          utils/appFeedback.test.ts utils/feedbackRouting.test.ts utils/feedbackArchitecture.test.ts utils/recordFeedback.test.ts
          components/RecordMessageActions.test.tsx components/UploadProgressOverlay.test.tsx pages/ShareTargetPage.test.tsx utils/uploadFileWithProgress.test.ts components/dashboard/MyTasksWidget.test.tsx components/dashboard/DashboardLayout.test.tsx
          --maxWorkers=1 --no-file-parallelism

      - name: Shared AI agents and chat surfaces regression checks
        timeout-minutes: 10
        run: >-
          npx vitest run supabase/functions/ai-assistant/operational-preflight.test.ts supabase/functions/_shared/ai-gateway.test.ts supabase/functions/_shared/ai-provider-keys.test.ts
          supabase/functions/_shared/ai-native-skills.test.ts supabase/functions/_shared/ai-agent-data.test.ts supabase/functions/_shared/ai-skills/instagram-tools.test.ts
          supabase/functions/_shared/ai-process-data.test.ts supabase/functions/_shared/ai-process-operations.test.ts supabase/functions/ai-assistant/process-execution.test.ts
          supabase/functions/_shared/ai-approval-edits.test.ts supabase/functions/ai-assistant/record-execution.test.ts
          supabase/functions/_shared/ai-context-lifecycle.test.ts supabase/functions/ai-assistant/thread-memory.test.ts supabase/functions/ai-assistant/free-chat.test.ts
          supabase/functions/_shared/ai-reasoning.test.ts
          supabase/functions/_shared/ai-focused-skills.test.ts supabase/functions/main/index.test.ts components/ai/AiAgentSkillsEditor.test.tsx components/ai/AiVoiceRecorder.test.tsx
          supabase/functions/_shared/ai-tool-calls.test.ts supabase/functions/ai-assistant/data-tool-loop.test.ts
          supabase/functions/_shared/ai-agent-task-contract.test.ts supabase/functions/_shared/ai-agent-task-runtime.test.ts
          supabase/functions/_shared/ai-agent-task-management.test.ts supabase/functions/ai-assistant/agent-task-execution.test.ts
          supabase/functions/_shared/ai-agent-task-lifecycle.test.ts components/ai/AiAgentTaskApprovalCard.test.tsx
          supabase/functions/_shared/ai-agent-task-queue.test.ts supabase/functions/workflow-interval-runner/agent-task-delivery.test.ts
          supabase/functions/_shared/ai-record-files.test.ts supabase/functions/_shared/ai-record-lookups.test.ts supabase/functions/_shared/ai-record-display.test.ts
          components/ai/AiRecordResultCard.test.tsx components/ai/AiUsageHistoryTable.test.tsx utils/aiMessageParts.test.ts
          supabase/functions/_shared/ai-record-contract.test.ts supabase/functions/_shared/ai-agents.test.ts supabase/functions/_shared/ai-agent-contract.test.ts supabase/functions/_shared/ai-agent-inbox.test.ts utils/__tests__/aiAaasFoundation.test.ts
          components/ai/AiMessageComposer.test.tsx components/ai/AiGenerationStatusCard.test.tsx
          components/ai/AiChatSurfaceV2.test.tsx components/ai/AssistantPanel.operators.test.tsx
          components/ai/AiCapabilityComposerActions.test.tsx components/ai/AiComposeModelBar.test.tsx components/AdaptivePickerSurface.test.tsx
          components/ai/AiRecordMutationApprovalCard.test.tsx components/ai/AiApprovalReviewModal.test.tsx components/ai/AiQuestionCard.test.tsx components/ai/AiMessageRenderer.test.tsx
          supabase/functions/_shared/mcp-server.test.ts
          --maxWorkers=1 --no-file-parallelism

      - name: Organization membership and login regression checks
        timeout-minutes: 10
        run: npm run test:organization-memberships

      - name: Public SEO recovery checks
        # No production credentials or real SMTP traffic are used by email regressions.
        run: node --test scripts/preserve-public-seo.test.mjs scripts/public-brand-seo.test.mjs

      - name: Organization email UI and SQL regression checks
        timeout-minutes: 8
        run: npm run test:organization-email

      - name: Organization SMS context regression checks
        run: npx vitest run utils/smsGateway.senderNumbers.test.ts --maxWorkers=1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: WooCommerce product transfer lock regression
        run: |
          directory="$(mktemp -d)"
          cp -r supabase/functions/external-connectors "$directory/"
          deno check --frozen --lock=deno.lock --node-modules-dir=none "$directory/external-connectors/index.ts"
          deno test --frozen --lock=deno.lock --node-modules-dir=none --allow-env=CI,FORCE_COLOR,NO_COLOR,TERM "$directory/external-connectors/product-content.deno.ts"

      - name: Organization email backend regression checks
        run: deno test --node-modules-dir=none --allow-env --allow-read --allow-sys supabase/functions/_shared/email-runtime.deno.ts supabase/functions/send-email/send-email.deno.ts

      - name: Email function dependency checks
        run: deno check --node-modules-dir=none supabase/functions/email-admin/index.ts supabase/functions/send-email/index.ts supabase/functions/email-provider-events/index.ts supabase/functions/email-sync-worker/index.ts supabase/functions/send-sms/index.ts

      - name: Prepare activity performance deployment dependencies
        run: |
          mkdir -p supabase/functions/activity-performance/_runtime-deps
          cp shared/recordRuntime.ts shared/taskRuntimeCatalog.ts supabase/functions/activity-performance/_runtime-deps/
          cp utils/formulaRuntime.ts supabase/functions/activity-performance/_runtime-deps/

      - name: AI assistant dependency checks
        run: |
          npm run ai:schemas:check
          deno check --node-modules-dir=none supabase/functions/_shared/ai-agent-task-management.ts supabase/functions/_shared/ai-agent-task-contract.ts supabase/functions/_shared/ai-agent-task-runtime.ts supabase/functions/_shared/ai-agent-task-queue.ts
          deno check --node-modules-dir=none supabase/functions/_shared/ai-agent-data.ts supabase/functions/_shared/ai-native-skills.ts supabase/functions/_shared/ai-tool-calls.ts
          deno check --node-modules-dir=none supabase/functions/_shared/ai-process-data.ts supabase/functions/_shared/ai-process-operations.ts
          deno check --node-modules-dir=none supabase/functions/_shared/ai-context-policy.ts supabase/functions/_shared/ai-context-lifecycle.ts supabase/functions/_shared/ai-context-compressor.ts
          deno check --node-modules-dir=none supabase/functions/_shared/ai-reasoning.ts supabase/functions/_shared/ai-reasoning-transport.ts
          deno check --node-modules-dir=none supabase/functions/_shared/ai-agents.ts supabase/functions/_shared/mcp-oauth.ts supabase/functions/_shared/mcp-runtime.ts supabase/functions/mcp-server/index.ts supabase/functions/ai-assistant/index.ts supabase/functions/external-connectors/index.ts supabase/functions/api-gateway/index.ts supabase/functions/webhook-delivery/index.ts supabase/functions/user-admin/index.ts supabase/functions/bot-admin/index.ts supabase/functions/bot-webhook/index.ts supabase/functions/report-runtime/index.ts supabase/functions/activity-performance/index.ts

      - name: Messaging attachment and viewer isolation regression checks
        timeout-minutes: 8
        run: >-
          npx vitest run utils/messageAttachmentPreview.test.ts utils/messageAttachments.test.ts
