name: CI-CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
      frontend_only:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  isolated_assistant_build:
    if: ${{ !inputs.deploy && inputs.frontend_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Assistant regression checks
        env:
          VITE_SUPABASE_URL: https://isolated-test.invalid
          VITE_SUPABASE_ANON_KEY: isolated-test-only
        run: npx vitest run components/ai/AiChatSurfaceV2.test.tsx components/ai/AssistantPanel.operators.test.tsx supabase/functions/ai-assistant/data-tool-loop.test.ts --maxWorkers=1 --no-file-parallelism
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Verify the assistant runtime dependencies
        run: deno check --node-modules-dir=none supabase/functions/ai-assistant/index.ts
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAP_STYLE_URL: ${{ secrets.VITE_MAP_STYLE_URL }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
        run: npm run build
      - name: Verify PWA and SEO release
        run: |
          node scripts/verify-pwa-release.mjs
          node --test scripts/verify-live-pwa-release.test.mjs scripts/preserve-public-seo.test.mjs scripts/public-brand-seo.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
