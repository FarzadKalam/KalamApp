  deploy_woocommerce_connector:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.woocommerce_connector_only && !inputs.frontend_only && !inputs.cash_bank_ledger_migration_only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check the WooCommerce connector and its regression tests
        run: |
          directory="$(mktemp -d)"
          cp -r supabase/functions/external-connectors "$directory/"
          deno check --frozen --lock=deno.lock --node-modules-dir=none "$directory/external-connectors/index.ts"
          deno test --frozen --lock=deno.lock --node-modules-dir=none --allow-env=CI,FORCE_COLOR,NO_COLOR,TERM "$directory/external-connectors/product-content.deno.ts"
      - name: Verify latest main and wait for earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-release.mjs
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Add server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy the WooCommerce connector
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_FUNCTIONS_PATH: /opt/kalamapp/supabase/docker/volumes/functions
          DEPLOY_FUNCTIONS_COMPOSE_DIR: /opt/kalamapp/supabase/docker
        run: ./scripts/deploy-supabase-function.ps1 -Functions @('external-connectors')
      - name: Check the live WooCommerce connector
        run: node scripts/smoke-woocommerce-connector.mjs

  deploy_cash_bank_ledger_migration:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy && inputs.cash_bank_ledger_migration_only && !inputs.frontend_only && !inputs.woocommerce_connector_only
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify latest main and wait for earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-release.mjs
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Add server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
      - name: Apply the approved ledger migration
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0 -or (git rev-parse origin/main) -ne $env:GITHUB_SHA) {
            throw 'Main advanced before the ledger migration. Validate the newest revision first.'
          }
          $migration = 'database_v1_phase617_cash_bank_ledger_cheque_lookup.sql'
          Get-FileHash -Algorithm SHA256 -LiteralPath $migration | Format-List
          & ./scripts/run-server-db-migrations.ps1 -SqlFiles @($migration)

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && !inputs.woocommerce_connector_only && !inputs.cash_bank_ledger_migration_only
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve concurrent committed changes and wait for earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-release.mjs

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          HOST="${SERVER_HOST:-}"
          PORT="${SERVER_PORT:-22}"

          if [ -z "$HOST" ]; then
            echo "::error::SERVER_HOST secret is empty."
            exit 1
          fi

          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::SERVER_PORT must be numeric."
            exit 1
          fi

          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              echo "SSH host key added for $HOST:$PORT"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan failed (attempt $attempt). Retrying..."
              sleep 3
            fi
          done

          echo "::error::Could not fetch SSH host key from $HOST:$PORT. Check SERVER_HOST/SERVER_PORT and firewall/public reachability from GitHub Actions."
          exit 1

      - name: Preserve published SEO pages during CMS outage
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if node -e 'process.exit(JSON.parse(require("fs").readFileSync("dist/seo-generation.json", "utf8")).dynamicComplete ? 0 : 1)'; then
            exit 0
          fi
          PREVIOUS_SEO="$RUNNER_TEMP/previous-public-seo"
          mkdir -p "$PREVIOUS_SEO"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/kalamapp}"
          for attempt in 1 2 3; do
            if timeout 60 ssh -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              -o ControlMaster=auto -o "ControlPath=$HOME/.ssh/deploy-%C" -o ControlPersist=600 \
              -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
              "tar -C '$DEPLOY_PATH/current' -cf - seo-pages" | tar -xf - -C "$PREVIOUS_SEO"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::CMS unavailable and previous public SEO pages could not be retrieved."
              exit 1
            fi
            sleep 3
          done
          node scripts/preserve-public-seo.mjs "$PREVIOUS_SEO/seo-pages" dist

      - name: Pack dist
        run: tar -czf dist.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: dist.tar.gz
          retention-days: 3

      - name: Pull exact CI bundle on server
        id: artifact_pull
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: node scripts/pull-ci-release-artifact.mjs

      - name: Upload bundle
        if: steps.artifact_pull.outcome != 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          # اتصال از runner کند است؛ rsync انتقال نیمه‌کاره را ادامه می‌دهد.
          export RSYNC_RSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ControlMaster=auto -o ControlPath=$HOME/.ssh/deploy-%C -o ControlPersist=600 -p $SERVER_PORT"
          ARCHIVE="/tmp/kalamapp-dist-${GITHUB_SHA}.tar.gz"
          for attempt in 1 2; do
            if timeout 480 rsync --append-verify --partial --timeout=90 \
              dist.tar.gz "$SERVER_USER@$SERVER_HOST:$ARCHIVE"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Artifact transfer failed twice."
              exit 1
            fi
            sleep 5
          done

          LOCAL_SHA="$(sha256sum dist.tar.gz | cut -d ' ' -f 1)"
          REMOTE_SHA=""
          for attempt in 1 2 3; do
            if REMOTE_SHA="$(timeout 45 ssh -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              -o ControlMaster=auto -o "ControlPath=$HOME/.ssh/deploy-%C" -o ControlPersist=600 \
              -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "sha256sum '$ARCHIVE'" | cut -d ' ' -f 1)"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not verify uploaded artifact after three connection attempts."
              exit 1
            fi
            sleep 3
          done
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::Uploaded artifact checksum mismatch."
            exit 1
          fi

      - name: Confirm this release includes the latest changes on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main has advanced. Test the newest source before deploying."
            exit 1
          fi

      - name: Apply the explicitly approved migrations
        if: ${{ !inputs.frontend_only && !inputs.ai_approval_release }}
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $migrations = if ('${{ inputs.ai_calendar_release }}' -eq 'true') {
            @('database_v1_phase621_atomic_saas_ai_provider_key_activation.sql', 'database_v1_phase622_ai_content_calendar_drafts.sql')
          } else {
            @('database_v1_phase615_customer_club_invoice_conditions.sql', 'database_v1_phase616_cash_bank_private_saved_views.sql', 'database_v1_phase619_saas_ai_provider_keys.sql', 'database_v1_phase620_external_mcp_access.sql')
          }
          $migrations | ForEach-Object { Get-FileHash -Algorithm SHA256 -LiteralPath $_ } | Format-List
          & ./scripts/run-server-db-migrations.ps1 -SqlFiles $migrations

      - name: Deploy Edge Functions
        if: ${{ !inputs.frontend_only }}
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_FUNCTIONS_PATH: /opt/kalamapp/supabase/docker/volumes/functions
          DEPLOY_FUNCTIONS_COMPOSE_DIR: /opt/kalamapp/supabase/docker
        run: |
          $functions = if ('${{ inputs.ai_approval_release }}' -eq 'true') {
            @('ai-assistant')
          } elseif ('${{ inputs.ai_calendar_release }}' -eq 'true') {
            @('workflow-interval-runner','ai-assistant','bot-webhook')
          } else {
            @('goal-progress','report-runtime','workflow-interval-runner','ai-assistant','bot-webhook','mcp-server','api-gateway')
          }
          ./scripts/deploy-supabase-function.ps1 -Functions $functions

      - uses: actions/setup-node@v4
        if: ${{ !inputs.frontend_only }}
        with:
          node-version: 20

      - name: Verify the live condition RPC and Edge Functions
        if: ${{ !inputs.frontend_only }}
        env:
          DEPLOY_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          DEPLOY_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VERIFY_AI_CALENDAR_RELEASE: ${{ inputs.ai_calendar_release }}
        run: node scripts/smoke-condition-runtimes.mjs

      - name: Recheck main before activating the frontend
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main has advanced. Test the newest source before activating the frontend."
            exit 1
          fi

      - name: Activate release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Note: SSH does not forward env vars by default, so we pass DEPLOY_PATH explicitly.
          timeout 120 ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o ControlMaster=auto \
            -o "ControlPath=$HOME/.ssh/deploy-%C" \
            -o ControlPersist=600 \
            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "DEPLOY_PATH='$DEPLOY_PATH' GITHUB_SHA='$GITHUB_SHA' bash -s" << 'EOF'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/kalamapp}"
          ARCHIVE="/tmp/kalamapp-dist-${GITHUB_SHA}.tar.gz"
          TS="$(date +%Y%m%d%H%M%S)"

          mkdir -p "$DEPLOY_PATH/releases"
          RELEASE_DIR="$DEPLOY_PATH/releases/$TS"
          mkdir -p "$RELEASE_DIR"

          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"

          # Keep last 5 releases for quick rollback.
          if [ -d "$DEPLOY_PATH/releases" ]; then
            ls -1dt "$DEPLOY_PATH/releases"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
          fi

          # Reload nginx if allowed for this user.
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl reload nginx || true
          fi

          echo "Deployed $RELEASE_DIR"
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify live PWA version and cache headers
        run: node scripts/verify-live-pwa-release.mjs
