name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kalamapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: ledger_test
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Isolated ledger SQL regression checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/sql/cash_bank_ledger_fixture.sql \
            database_v1_phase568_cash_bank_filtered_totals_and_print.sql \
            database_v1_phase568_cash_bank_filtered_totals_and_print.sql \
            tests/sql/cash_bank_ledger_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 < "$file"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Isolated system message access regression checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for file in tests/sql/system_note_guard_fixture.sql \
            database_v1_phase569_system_note_recipient_guard.sql \
            database_v1_phase569_system_note_recipient_guard.sql \
            database_v1_phase570_system_inbox_recipient_guard.sql \
            database_v1_phase570_system_inbox_recipient_guard.sql \
            tests/sql/system_note_guard_assertions.sql \
            tests/sql/system_note_sender_fixture.sql \
            database_v1_phase571_system_note_sender_is_not_recipient.sql \
            database_v1_phase571_system_note_sender_is_not_recipient.sql \
            tests/sql/system_note_sender_assertions.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U ledger_test -d ledger_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Messaging attachment and viewer isolation regression checks
        timeout-minutes: 8
        run: >-
          npx vitest run utils/messageAttachmentPreview.test.ts utils/messageAttachments.test.ts
          utils/internalNoteAccess.test.ts hooks/useInternalConversationTimeline.test.tsx
          hooks/useNotificationConversationList.test.tsx
          components/messaging/MessageAttachmentGallery.test.tsx components/common/ComposerDropZone.test.tsx
          components/common/AttachmentSourceButton.test.tsx
          --maxWorkers=1 --no-file-parallelism

      - name: Module list regression checks
        timeout-minutes: 12
        run: >-
          npx vitest run
          utils/tableColumnLayout.test.ts utils/moduleListLocalRows.test.ts
          utils/moduleListShortcut.test.ts utils/moduleListColumnFilters.test.ts
          utils/moduleListFilterDisplay.test.ts
          utils/optionHelpers.test.ts utils/moduleListLive.test.ts
          utils/saasPlanDisplayFeatures.test.ts
          hooks/useTableColumnLayout.test.tsx components/table/TableChoiceFilter.test.tsx
          components/SmartTableRenderer.test.tsx
          components/moduleList/RelatedActivityIndicators.test.tsx
          components/moduleList/Toolbar.ai.test.tsx components/moduleList/RenderCardItem.test.tsx
          components/RelationQuickCreate.test.tsx utils/moduleListOptions.test.ts
          --maxWorkers=1 --no-file-parallelism

      - name: Cash and bank report regression checks
        timeout-minutes: 8
        run: >-
          npx vitest run pages/CashBankPage.test.tsx utils/cashBankLedger.test.ts
          utils/printTemplates/store.test.ts utils/listPrintExport.test.ts
          utils/printTemplates/nativePrintFlow.test.ts utils/printTemplates/nativeTablePagination.test.ts
          utils/printTemplates/buildPrintDocumentHtml.test.ts utils/printTemplates/templateRenderer.test.ts
          utils/printTemplates/staticPrintPagination.test.ts utils/printTemplates/fragmentPacking.test.ts
          utils/printTemplates/letterheadSignatureFlow.test.ts utils/printTemplates/tableRowSlices.test.ts
          utils/printTemplates/splitPrintTextBlock.test.ts
          utils/printTemplates/printFlowStructure.test.ts
          utils/printTemplates/tableCellContinuations.test.ts
          --maxWorkers=1 --no-file-parallelism

      - name: HR filters and picker regression checks
        timeout-minutes: 5
        run: >-
          npx vitest run
          utils/hrFilters.test.ts utils/popupContainer.test.ts
          components/AdaptiveSelectField.test.tsx components/PersianDateRangePicker.test.tsx
          --maxWorkers=1 --no-file-parallelism

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAP_STYLE_URL: ${{ secrets.VITE_MAP_STYLE_URL }}
        run: npm run build

      - name: Verify PWA release
        run: node scripts/verify-pwa-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Pack dist
        run: tar -czf dist.tar.gz -C dist .

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          HOST="${SERVER_HOST:-}"
          PORT="${SERVER_PORT:-22}"

          if [ -z "$HOST" ]; then
            echo "::error::SERVER_HOST secret is empty."
            exit 1
          fi

          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::SERVER_PORT must be numeric."
            exit 1
          fi

          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              echo "SSH host key added for $HOST:$PORT"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan failed (attempt $attempt). Retrying..."
              sleep 3
            fi
          done

          echo "::error::Could not fetch SSH host key from $HOST:$PORT. Check SERVER_HOST/SERVER_PORT and firewall/public reachability from GitHub Actions."
          exit 1

      - name: Upload bundle
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          # اتصال از runner کند است؛ rsync انتقال نیمه‌کاره را ادامه می‌دهد.
          export RSYNC_RSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $SERVER_PORT"
          ARCHIVE="/tmp/kalamapp-dist-${GITHUB_SHA}.tar.gz"
          for attempt in 1 2; do
            if timeout 480 rsync --append-verify --partial --timeout=90 \
              dist.tar.gz "$SERVER_USER@$SERVER_HOST:$ARCHIVE"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Artifact transfer failed twice."
              exit 1
            fi
            sleep 5
          done

          LOCAL_SHA="$(sha256sum dist.tar.gz | cut -d ' ' -f 1)"
          REMOTE_SHA="$(ssh -o BatchMode=yes -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" "sha256sum '$ARCHIVE'" | cut -d ' ' -f 1)"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::Uploaded artifact checksum mismatch."
            exit 1
          fi

      - name: Activate release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Note: SSH does not forward env vars by default, so we pass DEPLOY_PATH explicitly.
          timeout 120 ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "DEPLOY_PATH='$DEPLOY_PATH' GITHUB_SHA='$GITHUB_SHA' bash -s" << 'EOF'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/kalamapp}"
          ARCHIVE="/tmp/kalamapp-dist-${GITHUB_SHA}.tar.gz"
          TS="$(date +%Y%m%d%H%M%S)"

          mkdir -p "$DEPLOY_PATH/releases"
          RELEASE_DIR="$DEPLOY_PATH/releases/$TS"
          mkdir -p "$RELEASE_DIR"

          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"

          # Keep last 5 releases for quick rollback.
          if [ -d "$DEPLOY_PATH/releases" ]; then
            ls -1dt "$DEPLOY_PATH/releases"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
          fi

          # Reload nginx if allowed for this user.
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl reload nginx || true
          fi

          echo "Deployed $RELEASE_DIR"
          EOF
