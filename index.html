<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" as="font" type="font/woff2" href="/font/peyada/PeydaWeb-Regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/font/peyada/PeydaWeb-Black.woff2" crossorigin />
    <link rel="icon" type="image/png" href="/favicon.png?v=f01" sizes="64x64" />
    <link rel="manifest" href="/manifest.webmanifest?v=f01" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=f01" />
    <meta name="theme-color" content="#F82377" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="تازه سیستم" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>تازه سیستم</title>
    <style>
      [data-seo-fallback="true"], .app-startup-placeholder { display: none; }
      #root:empty + .app-startup-placeholder {
        position: fixed; inset: 0; display: grid; place-content: center;
        justify-items: center; gap: 1rem; color: white; background: #1c1c1f;
      }
      .app-startup-indicator {
        width: 2.5rem; height: 2.5rem; border-radius: 50%;
        border: 2px solid #ffffff44; border-top-color: #f82377;
        animation: app-startup-spin 1s linear infinite;
      }
      .app-startup-placeholder a { color: inherit; text-decoration: underline; }
      @keyframes app-startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-startup-indicator { animation: none; } }
    </style>
    <noscript><style>[data-seo-fallback="true"] { display: block; } #root:empty + .app-startup-placeholder { display: none; }</style></noscript>
  </head>
  <body class="bg-gray-100 dark:bg-[#141414] text-gray-900 dark:text-gray-100 font-sans">
    <div id="root"></div>
    <div class="app-startup-placeholder" aria-label="در حال آماده‌سازی سامانه" role="status">
      <span class="app-startup-indicator" aria-hidden="true"></span>
    </div>
    <script src="/kalamapp-runtime-config.js"></script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
